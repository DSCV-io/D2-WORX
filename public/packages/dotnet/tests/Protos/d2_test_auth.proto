// -----------------------------------------------------------------------
// d2_test_auth.proto — minimal gRPC services used exclusively by
// GrpcAuthIntegrationTests in DcsvIo.D2.Tests. NOT a wire contract; not
// referenced by any production service. Two distinct services exercise the
// auth pipeline through the fluent-metadata path:
//
//   - TestEcho (Echo) — wired with .RequireAnyScope("test.scope") at MapGrpcService time
//   - TestHealth (Health) — wired with .MarkAsD2HarmlessEndpoint() at MapGrpcService time
//
// Two services (rather than one mixed service) sidestep the fluent-metadata
// "applies to all methods on the builder" semantic. The auth-grpc unit tests
// (JwtAuthInterceptorTests, D2RequireAnyScopeAttributeTests,
// D2RequireAllScopesAttributeTests) cover attribute-path metadata and
// class-level vs method-level precedence in isolation.
// -----------------------------------------------------------------------
syntax = "proto3";

package d2.test.auth;

option csharp_namespace = "DcsvIo.D2.Tests.Unit.Auth.Inbound.Grpc.Protos";

service TestEcho {
  rpc Echo(EchoRequest) returns (EchoReply);
}

service TestHealth {
  rpc Health(HealthRequest) returns (HealthReply);
}

message EchoRequest {
  string payload = 1;
}

message EchoReply {
  string echoed = 1;
}

message HealthRequest {}

message HealthReply {
  string status = 1;
}
