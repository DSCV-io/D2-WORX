# Export dry-run — gated public OSS surface validation.
#
# Manual workflow_dispatch only (never on every push).
# Validates allowlist (public/** + closed extras) + hard denylist + IP path
# fence. Optionally stages an isolated export tree and builds
# public/D2.Public.slnx inside the stage (anti–GetPathOfFileAbove walk-out).
# Never pushes remotes. Least privilege: contents: read.

name: Export dry-run

on:
  workflow_dispatch:
    inputs:
      stage_and_build:
        description: "Stage isolated export tree and build public/D2.Public.slnx"
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  export-dry-run:
    name: Export dry-run (allowlist + stage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        if: ${{ inputs.stage_and_build }}
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate export surface (no stage)
        if: ${{ inputs.stage_and_build == false }}
        run: node public/tools/scripts/export-dry-run.mjs

      - name: Validate + stage + build public/D2.Public.slnx
        if: ${{ inputs.stage_and_build }}
        run: |
          STAGE_DIR="$(mktemp -d /tmp/d2-export-stage.XXXXXX)"
          echo "Stage dir: $STAGE_DIR"
          node public/tools/scripts/export-dry-run.mjs --stage-dir "$STAGE_DIR" --build
