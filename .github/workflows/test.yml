  #         node-version: "24"
  #     - uses: pnpm/action-setup@v4
  #       with:
  #         version: 10
  #     - run: pnpm install --frozen-lockfile
  #       working-directory: server/web
  #     - run: pnpm exec vitest run --browser
  #       working-directory: server/web

  # web-mock-playwright-tests — activates when `server/web/` SvelteKit workspace resolves
  # web-mock-playwright-tests:
  #   name: Web Playwright (mocked)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "24"
  #     - uses: pnpm/action-setup@v4
  #       with:
  #         version: 10
  #     - run: pnpm install --frozen-lockfile
  #       working-directory: server/web
  #     - run: pnpm exec playwright install chromium
  #       working-directory: server/web
  #     - run: pnpm exec playwright test
  #       working-directory: server/web
  #       env:
  #         D2_MOCK_INFRA: "true"

  contract-fixtures-emit:
    name: Contract fixture emission (.NET → fixtures)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test server/shared/dotnet/tests/D2.Shared.Tests.csproj --configuration Release -- --filter-trait "Category=ContractFixtures"
      - name: assert no fixture drift
        run: git diff --exit-code server/shared/typescript/contract-tests/fixtures/

  # contract-tests-parity — blocked: pnpm workspace install needs the missing
  # @d2/auth-bff-client workspace package (B18) before --frozen-lockfile succeeds,
  # and the repo needs a root `test:contracts` script.
  # contract-tests-parity:
  #   name: Contract parity tests (TS reads fixtures + asserts)
  #   runs-on: ubuntu-latest
  #   needs: [contract-fixtures-emit]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "24"
  #     - uses: pnpm/action-setup@v4
  #       with:
  #         version: 10
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm test:contracts

  # ==========================================================================
  # TypeSpec byte-gate — active now (no service dependencies)
  # Runs the emitter unit tests (byte-parity gates) on every PR + push.
  # ==========================================================================
  typespec-byte-gate:
    name: TypeSpec emitter byte-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (emitter subtree + ts-codegen build tool)
        run: pnpm install --filter "@d2/typespec-emitters..." --filter "ts-codegen..."
      - name: build (emitter + decorators dist/)
        run: pnpm --filter "@d2/typespec-emitters..." build
      - name: TypeSpec emitter tests (byte-parity gate)
        run: pnpm --filter "@d2/typespec-emitters" test
