name: PR

# PR CI — parallel lanes (dual suite).
#
# Public-parity jobs (copy shape/commands to d2-public at human H5):
#   - Proto checks (buf lint + format)
#   - Contract gate unit tests
#   - Release runner unit tests
#   - Commit lint unit tests
#   - Repo script tests (node --test)
#   - Geo Data Pipeline Tests
#   - Versioning integration (artifact-diff engine)
#   - Public build (D2.Public.slnx)
#   - .NET Shared Unit Tests
#   - .NET Shared Integration Tests
#   - TS Shared Unit Tests
#   - Contract fixture emission (.NET → fixtures)
#   - TypeSpec emitter byte-gate
#   - Pack smoke (.NET nupkg + TS tgz)
#
# Combined private monorepo also runs: Build (umbrella), Edge unit/integration,
# TS services unit, TS integration, proto/contract breaking gates (dual roots).
#
# Active jobs run in parallel as services and workspace packages come online.
# Jobs whose target path is not yet populated remain commented with a brief
# blocker note; active jobs are the current gate surface.
# Total wall time target: <5 minutes for the standard lanes (all jobs run in
# parallel). JetBrains inspectcode is a LOCAL zero-warning gate only (gates.sh /
# COMMANDS.md) — not a CI job (slow, low merge-signal).
#
# All active jobs must pass before merge. Required branch-protection checks
# select by job DISPLAY name, so renaming a job silently detaches it from
# Settings → Branches required status checks — treat display names as stable.

on:
  pull_request:
    branches: [main, nova]
  push:
    branches: [main, nova]

jobs:
  # ==========================================================================
  # Active now (no service dependencies)
  # ==========================================================================

  # ---------------------------------------------------------------------------
  # Proto checks (buf lint + format) — active: buf.yaml committed under public.
  # Enforces STANDARD lint rules and format consistency on hand-authored protos.
  # Scoped to `public/contracts/protos/` (shared stable protos); emitted
  # *.g.proto files are NOT reformatted here (§26.5 — fix the emitter, never
  # hand-edit generated output).
  # ---------------------------------------------------------------------------
  proto-checks:
    name: Proto checks (buf lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf lint (STANDARD rule set)
        run: buf lint public/contracts/protos
      - name: buf format (hand-authored protos only)
        run: buf format --diff --exit-code public/contracts/protos

  # ---------------------------------------------------------------------------
  # Proto breaking-change gate — always on, PR-blocking.
  # Runs `buf breaking` at FILE level over `public/contracts/protos/` against
  # the `nova` baseline (legacy baseline paths remapped by contract-gate).
  # Pre-stable packages (vNalpha/vNbeta) are exempt via the `proto-arm` wrapper
  # in `public/tools/contract-gate`. The shared `d2.common.v1` protos are stable
  # and always enforced.
  # Needs full git history (`fetch-depth: 0`) so `nova` resolves as a ref.
  # ---------------------------------------------------------------------------
  proto-breaking:
    name: Proto breaking-change gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch nova baseline
        run: git fetch origin nova:nova
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (contract-gate + its workspace deps)
        run: pnpm install --fail-if-no-match --filter "contract-gate..." --filter "@dcsv-io/d2-typespec-emitters..."
      - name: build contract-gate
        run: pnpm --fail-if-no-match --filter contract-gate build
      - name: Proto breaking-change gate (buf breaking at FILE level vs nova)
        run: node public/tools/contract-gate/dist/cli.js --against nova --proto-only

  # ---------------------------------------------------------------------------
  # Contract breaking-change gate (spec / i18n / OpenAPI) — always on, PR-blocking.
  # Runs the JSON-diff gate over dual roots `public/contracts/**` +
  # `private/contracts/**` against the `nova` baseline (legacy path remap).
  # Needs full git history so `git show nova:<path>` resolves baseline file content.
  # ---------------------------------------------------------------------------
  contract-breaking:
    name: Contract breaking-change gate (spec / i18n / OpenAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch nova baseline
        run: git fetch origin nova:nova
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (contract-gate + its workspace deps)
        run: pnpm install --fail-if-no-match --filter "contract-gate..." --filter "@dcsv-io/d2-typespec-emitters..."
      - name: build contract-gate
        run: pnpm --fail-if-no-match --filter contract-gate build
      - name: Spec / i18n / OpenAPI breaking-change gate (JSON-diff vs nova)
        run: node public/tools/contract-gate/dist/cli.js --against nova --skip-proto

  # ---------------------------------------------------------------------------
  # Contract-gate unit tests — always on.
  # Runs the owned-code test suite for `public/tools/contract-gate` (footer parser,
  # discovery, safe-args, cli-flags, baseline, catalog-identity, spec-diff,
  # i18n-diff, openapi-diff, proto-exemption, proto-arm integration, and the
  # run-spec-gate end-to-end harness). §26.15/§26.16 owned-tooling validation.
  # ---------------------------------------------------------------------------
  contract-gate-unit:
    name: Contract gate unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (contract-gate + its workspace deps)
        run: pnpm install --fail-if-no-match --filter "contract-gate..." --filter "@dcsv-io/d2-typespec-emitters..." --filter "ts-codegen..."
      - name: build contract-gate dependencies
        run: pnpm --fail-if-no-match --filter "@dcsv-io/d2-typespec-emitters..." build
      - name: Contract gate unit + integration tests
        run: pnpm --fail-if-no-match --filter contract-gate test

  # ---------------------------------------------------------------------------
  # Release-runner unit tests — always on.
  # Runs the owned-code test suite for `public/tools/release-runner` (bump engine,
  # manifest editor, changelog editor, semver, and runner integration tests).
  # §26.15/§26.16 owned-tooling validation — mirrors contract-gate-unit.
  # ---------------------------------------------------------------------------
  release-runner-unit:
    name: Release runner unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (release-runner + its workspace deps)
        run: pnpm install --fail-if-no-match --filter "release-runner..." --filter "ts-codegen..."
      - name: build release-runner dependencies
        run: pnpm --fail-if-no-match --filter "release-runner^..." build
      - name: Release runner typecheck (src + tests)
        run: pnpm --fail-if-no-match --filter release-runner typecheck
      - name: Release runner unit tests
        run: pnpm --fail-if-no-match --filter release-runner test

  # ---------------------------------------------------------------------------
  # Commit-lint unit tests — always on.
  # Validates the commit-msg hook's conventional-commit type-allowlist and
  # format enforcement logic (allowed types, reject paths, skip-forms).
  # §26.15/§26.16 owned-tooling validation — mirrors release-runner-unit.
  # ---------------------------------------------------------------------------
  commit-lint-unit:
    name: Commit lint unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (commit-lint)
        run: pnpm install --fail-if-no-match --filter "commit-lint"
      - name: Commit lint typecheck
        run: pnpm --fail-if-no-match --filter commit-lint typecheck
      - name: Commit lint unit tests
        run: pnpm --fail-if-no-match --filter commit-lint test

  # ---------------------------------------------------------------------------
  # Repo script tests — always on.
  # Runs the node built-in test runner over public/tools/scripts/tests/*.test.mjs
  # (commit/destructive-git guard hook matrix + PublicAPI / api-extractor empty-
  # surface guards + CI surface / export / publish fence tests). Node built-ins
  # only — no pnpm install. The hook script under test is committed
  # (.claude/hooks/git-guard.sh). §26.15/§26.16 owned-tooling.
  # Explicit-file glob is required: directory form does not discover *.test.mjs
  # on Node 24.
  # ---------------------------------------------------------------------------
  repo-script-tests:
    name: Repo script tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: public/tools/scripts guard suites (node built-in test runner)
        run: node --test public/tools/scripts/tests/*.test.mjs

  # ---------------------------------------------------------------------------
  # Geo data pipeline tests — always on.
  # Runs the public/tools/geo-data-pipeline vitest suite (unit + parity).
  # Self-contained package (no workspace deps); vitest transforms TS sources
  # directly. Parity tests read committed public/contracts/geo/* specs present
  # via checkout. §26.15/§26.16 owned-tooling validation.
  # ---------------------------------------------------------------------------
  geo-data-pipeline-tests:
    name: Geo Data Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (geo-data-pipeline only)
        run: pnpm install --fail-if-no-match --filter geo-data-pipeline
      - name: geo-data-pipeline tests
        run: pnpm --fail-if-no-match --filter geo-data-pipeline test

  # ---------------------------------------------------------------------------
  # Versioning integration lane — required/blocking.
  # Guards the artifact-diff versioning engine. The bump signals are build-free —
  # the apiDiff is a git-ref text diff of the committed API reports and the
  # fingerprint is a SOURCE-BASED hash (committed source + report + resolved deps
  # + the declared toolchain pin), so this lane runs NO .NET build. It:
  #   1. builds the shared-TS dists + runs api-extractor in production mode (--ci)
  #      to guard the committed `.api.md` CURRENCY against the built `dist`
  #      (the one thing still needing a built dist — TS has no RS0016 analog);
  #   2. runs the baseline-drift check (drift-check.ts) — re-derives every
  #      committed API-report diff + recomputes every source-based
  #      .release-fingerprint and FAILS on any drift without a same-PR bump.
  # The .NET API-report currency is owned by the `build` job (RS0016/RS0017 are
  # errors under TreatWarningsAsErrors), so no .NET SDK is needed here.
  # ---------------------------------------------------------------------------
  versioning-integration:
    name: Versioning integration (artifact-diff engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — the API-report baseline reader does `git show HEAD:<path>`.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      # Scoped install: release-runner pulls api-extractor (a devDep) + its deps;
      # the shared-TS subtree pulls @dcsv-io/d2-* build deps; ts-codegen for prebuilds.
      - name: pnpm install (release-runner + shared-TS subtree + ts-codegen)
        run: >
          pnpm install --fail-if-no-match
          --filter "release-runner..."
          --filter "./public/packages/typescript/**..."
          --filter "ts-codegen..."
      # The gated TS `.api.md` currency gate runs api-extractor against dist/.
      - name: build the shared-TS dists
        run: pnpm --fail-if-no-match --filter "./public/packages/typescript/**" -r build
      # Build release-runner's workspace dependency closure (contract-gate,
      # ts-codegen, etc.) so import { ... } from "contract-gate" resolves at
      # test/runtime. Mirrors the release-runner-unit lane's build step.
      - name: build release-runner dependencies
        run: pnpm --fail-if-no-match --filter "release-runner^..." build
      - name: Versioning TS api.md currency + drift check
        run: pnpm --fail-if-no-match --filter release-runner test
      - name: Baseline drift check (API reports + source-based fingerprint)
        run: pnpm --fail-if-no-match --filter release-runner exec tsx src/drift-check-cli.ts

  # lint-and-format (web half) — blocked: private/services/web/ SvelteKit workspace is not
  # yet resolvable (missing @dcsv-io/d2-auth-bff-client workspace package; tracked B18).
  # lint-and-format:
  #   name: Lint + format (web)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "24"
  #     - uses: pnpm/action-setup@v4
  #     - name: pnpm install (private/services/web)
  #       run: pnpm install --frozen-lockfile
  #       working-directory: private/services/web
  #     - name: ESLint + Prettier (private/services/web)
  #       run: |
  #         pnpm exec eslint .
  #         pnpm exec prettier --check .
  #       working-directory: private/services/web

  # ==========================================================================
  # Per-service lanes — active for shipped paths; remaining blocks wait on web.
  # ==========================================================================

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build D2.slnx --configuration Release

  # Public-only solution build — dual-suite proof (zero private ProjectReference
  # restore for the OSS surface). Monorepo root props are present here; export
  # clone self-sufficiency is proven by export-dry-run stage-dir, not this job.
  public-build:
    name: Public build (D2.Public.slnx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build public/D2.Public.slnx --configuration Release

  dotnet-shared-unit-tests:
    name: .NET Shared Unit Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test public/packages/dotnet/tests/DcsvIo.D2.Tests.csproj --configuration Release -- --filter-namespace "DcsvIo.D2.Tests.Unit*"

  dotnet-shared-integration-tests:
    name: .NET Shared Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test public/packages/dotnet/tests/DcsvIo.D2.Tests.csproj --configuration Release -- --filter-namespace "DcsvIo.D2.Tests.Integration*"

  edge-unit-tests:
    name: Edge Unit Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test private/services/edge/tests --configuration Release -- --filter-namespace "DcsvIo.D2.Private.Edge.Tests.Unit*"

  # ---------------------------------------------------------------------------
  # Edge integration tests — includes NodeLeafClient cross-runtime harness.
  # Node on PATH + a built @dcsv-io/d2-private-key-custodian-client dist are
  # necessary so the Node↔Kestrel cases EXECUTE rather than skip-with-reason;
  # a feasible loopback mTLS handshake on the runner is also required
  # (live-handshake feasibility). The standing skip-reason assertion fails the
  # lane if node, client-dist, OR live-handshake-infeasibility skip messages
  # appear in the test output (execute-not-skip for all three gates).
  # ---------------------------------------------------------------------------
  edge-integration-tests:
    name: Edge Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (key-custodian client + workspace deps + ts-codegen)
        run: pnpm install --fail-if-no-match --filter "@dcsv-io/d2-private-key-custodian-client..." --filter "ts-codegen..."
      - name: build @dcsv-io/d2-private-key-custodian-client dist (+ dep dists)
        run: pnpm --fail-if-no-match --filter "@dcsv-io/d2-private-key-custodian-client..." -r build
      - name: Edge integration tests
        run: |
          set -o pipefail
          # NODE_PATH so the mtls-probe (cwd=client-ts/scripts) resolves workspace
          # packages the same way pnpm links them for the private KC client.
          export NODE_PATH="${GITHUB_WORKSPACE}/private/services/edge/key-custodian/client-ts/node_modules${NODE_PATH:+:$NODE_PATH}"
          # Also ensure probe can resolve from package root when node walks parents.
          export NODE_OPTIONS="${NODE_OPTIONS:-}"
          if ! dotnet test private/services/edge/tests --configuration Release -- --filter-namespace "DcsvIo.D2.Private.Edge.Tests.Integration*" 2>&1 | tee edge-integration.log; then
            echo "==== FAILED test names (MTP TestResults) ===="
            # Strip NULs so grep treats the MTP log as text (§24.33).
            # Prefer method/display-name lines; fall back to assert/exception stacks.
            find private/services/edge/tests -path '*/TestResults/*.log' -type f 2>/dev/null | while IFS= read -r tl; do
              echo "--- $tl ---"
              tr -d '\0' < "$tl" | grep -aiE 'SealProvisioning|Rotation_|HotSwap|keyring-refresher|OnlyContain|NOT_FOUND|ErrorCode|failed |error |exception|assert|should' | head -120 || true
            done || true
            # Console summary often has the only readable FQN when MTP binary log is sparse.
            grep -aiE 'failed|error |SealProvisioning|Rotation_|HotSwap' edge-integration.log | head -40 || true
            exit 1
          fi
      - name: assert NodeLeafClient prereqs did not force skips
        # Fails if node/dist OR live-handshake-infeasibility skip reasons appear —
        # all three gates named in the job comment must hold for execute-not-skip.
        run: |
          skip_pat='node was not found on PATH|@dcsv-io/d2-private-key-custodian-client dist is not built|did not complete the spike handshake|loopback mutual-TLS handshake could not be established|live-handshake spike could not run'
          if grep -qE "$skip_pat" edge-integration.log; then
            echo "NodeLeafClient cases still skipped (node, client dist, or live-handshake infeasibility)"
            grep -E "$skip_pat" edge-integration.log || true
            exit 1
          fi
          # G7 AFTER evidence: prove live cases ran (Skipped must not swallow NodeLeaf).
          if ! grep -qE 'Passed!|failed!|Failed!' edge-integration.log; then
            echo "edge-integration.log missing MTP summary line"
            exit 1
          fi
          # Soft signal: if the summary still shows Skipped>0, dump it for journal.
          grep -E 'Failed:|Passed:|Skipped:|Total:' edge-integration.log || true

  ts-shared-unit-tests:
    name: TS Shared Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      # Scoped install: pulls the public/packages/typescript/** subtree and their
      # workspace deps only. The trailing `...` includes transitive workspace deps.
      # `public/tools/ts-codegen` is also included because several shared-lib prebuild
      # scripts invoke it via `pnpm --filter ts-codegen exec tsx ...`; without it
      # those prebuilds would fail. `private/services/web` (B18) is NOT in the
      # closure, so the frozen-lockfile install remains clean.
      - name: pnpm install (shared-TS subtree + ts-codegen)
        run: pnpm install --fail-if-no-match --filter "./public/packages/typescript/**..." --filter "ts-codegen..."
      - name: build (shared-TS packages that need a dist/ before tests run)
        run: pnpm --fail-if-no-match --filter "./public/packages/typescript/**" -r build
      - name: ts-codegen typecheck (src + tests)
        run: pnpm --fail-if-no-match --filter ts-codegen typecheck
      - name: ts-codegen unit tests
        run: pnpm --fail-if-no-match --filter ts-codegen test
      - name: TS shared unit tests
        run: pnpm --fail-if-no-match --filter "./public/packages/typescript/**" -r test

  # ---------------------------------------------------------------------------
  # TS services unit tests — service-owned client packages under private/services.
  # The pnpm workspace includes private/services/**; path filters auto-adopt a
  # future service client-ts package. ts-codegen is in the install because
  # shared-lib prebuild scripts invoke it. The build uses the dependency-
  # closure filter (...) so @dcsv-io/d2-* dep dists exist before vitest resolves them.
  # ---------------------------------------------------------------------------
  ts-services-unit-tests:
    name: TS Services Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      # Package-name `...` closure (not path `./private/services/**...`) — path
      # filters under-install shared-TS deps and tsc -b fails resolving deps.
      # Matches edge-integration-tests / known-good client build graph.
      - name: pnpm install (key-custodian client + workspace deps + ts-codegen)
        run: pnpm install --fail-if-no-match --filter "@dcsv-io/d2-private-key-custodian-client..." --filter "ts-codegen..."
      - name: build (workspace dependency dists the client packages import)
        run: pnpm --fail-if-no-match --filter "@dcsv-io/d2-private-key-custodian-client..." -r build
      - name: TS services unit tests
        run: pnpm --fail-if-no-match --filter "@dcsv-io/d2-private-key-custodian-client" test

  # ---------------------------------------------------------------------------
  # TS integration tests (Testcontainers) — packages defining test:integration.
  # pnpm -r runs only in packages that define the script (today: messaging-
  # rabbitmq); wide path filters auto-adopt future suites in either subtree.
  # Docker is available on ubuntu-latest (same host as the .NET Testcontainers
  # lanes). Image-pull flake / anonymous Docker Hub rate-limit: suite carries
  # generous timeouts; residual flake accepted via re-run.
  # ---------------------------------------------------------------------------
  ts-integration-tests:
    name: TS Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (shared-TS + services-TS subtrees + ts-codegen)
        run: pnpm install --fail-if-no-match --filter "./public/packages/typescript/**..." --filter "./private/services/**..." --filter "ts-codegen..."
      - name: build (dists for the packages under test + their deps)
        run: pnpm --fail-if-no-match --filter "./public/packages/typescript/**" --filter "./private/services/**..." -r build
      - name: TS integration tests (Testcontainers)
        run: |
          set -o pipefail
          pnpm --fail-if-no-match --filter "./public/packages/typescript/**" --filter "./private/services/**" -r test:integration 2>&1 | tee ts-integration.log
      - name: assert integration suites executed
        # Residual silent-green if filters match packages but none define test:integration.
        run: |
          if ! grep -qE 'messaging-rabbitmq|tests/integration/' ts-integration.log; then
            echo "TS integration lane produced no rabbitmq integration suite evidence"
            exit 1
          fi

  # unit-tests-web — activates when `private/services/web/` SvelteKit workspace resolves
  # unit-tests-web:
  #   name: Unit tests (web — Vitest browser mode)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "24"
  #     - uses: pnpm/action-setup@v4
  #       with:
  #         version: 10
  #     - run: pnpm install --frozen-lockfile
  #       working-directory: private/services/web
  #     - run: pnpm exec vitest run
  #       working-directory: private/services/web

  # web-component-tests — activates when `private/services/web/` SvelteKit workspace resolves
  # web-component-tests:
  #   name: Web component tests (Vitest browser mode)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "24"
  #     - uses: pnpm/action-setup@v4
  #       with:
  #         version: 10
  #     - run: pnpm install --frozen-lockfile
  #       working-directory: private/services/web
  #     - run: pnpm exec vitest run --browser
