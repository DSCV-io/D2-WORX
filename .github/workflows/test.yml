  # contract-fixtures-emit — activates once the dotnet build job activates.
  # Re-emits the cross-language parity fixtures and asserts no fixture drift.
  # contract-fixtures-emit:
  #   name: Contract fixture emission (.NET → fixtures)
  #   runs-on: ubuntu-latest
