  #       working-directory: server/web
  #     - name: dotnet build (StyleCop + analyzers)
  #       run: dotnet build server/D2.slnx --configuration Release
  #     - name: jb inspectcode
  #       run: |
  #         dotnet tool restore
  #         dotnet jb inspectcode server/D2.slnx --severity=WARNING --no-build

  # ==========================================================================
  # Activates per service — uncomment each block as the cited path ships.
  # ==========================================================================

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build server/D2.slnx --configuration Release

  unit-tests-dotnet:
    name: Shared library tests (.NET)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test server/shared/dotnet/tests/D2.Shared.Tests.csproj --configuration Release
      # TEMP DIAGNOSTIC (revert): dump failing-test names + context from the MTP
      # TestResults log so the flaky set can be enumerated from the real runner.
      - name: Dump failing tests on failure (temp diagnostic)
        if: failure()
        run: |
          echo "===== FAILED TEST HEADERS ====="
          grep -rhnE "^failed " server/shared/dotnet/tests/bin/Release/net10.0/TestResults/ || true
          echo "===== FULL TESTRESULTS LOG ====="
          cat server/shared/dotnet/tests/bin/Release/net10.0/TestResults/*.log || true

  # unit-tests-web — activates when `server/web/` SvelteKit workspace resolves
  # unit-tests-web:
  #   name: Unit tests (web — Vitest browser mode)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "24"
  #     - uses: pnpm/action-setup@v4
  #       with:
  #         version: 10
  #     - run: pnpm install --frozen-lockfile
  #       working-directory: server/web
  #     - run: pnpm exec vitest run
  #       working-directory: server/web

  # integration-edge — activates when `server/services/edge/tests/` ships
  # integration-files — activates when `server/services/files/tests/` ships
  # integration-courier — activates when `server/services/courier/tests/` ships
  # integration-notifications — activates when `server/services/notifications/tests/` ships
  # integration-audit — activates when `server/services/audit/tests/` ships
  #
  # Pattern (one per service):
  # integration-{service}:
  #   name: Integration tests ({service})
  #   runs-on: ubuntu-latest
  #   needs: [build]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-dotnet@v4
  #       with:
  #         dotnet-version: "10.0.x"
  #     - run: dotnet test server/services/{service}/tests --configuration Release

  # integration-key-rotation — REQUIRED GATE. Runs the full edge test project, which
  # includes the KeyCustodian rotation, lifecycle, persistence, and concurrency
  # integration tests. The full project is targeted rather than a category filter
  # for two reasons: (1) the stack runs on Microsoft.Testing.Platform, which silently
  # ignores VSTest-style --filter flags (emits warning MTP0001 and runs everything
  # anyway); the correct MTP trait filter (-- --filter-trait "Category=Integration")
  # would work, but (2) Category traits are sparsely applied, and MTP treats an
  # assembly that matches zero tests as a run failure — making a trait filter fragile
  # when test authors omit the attribute. Running the whole project is reliable.
  integration-key-rotation:
    name: Edge integration tests (REQUIRED)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test server/services/edge/tests --configuration Release

  # web-component-tests — activates when `server/web/` SvelteKit workspace resolves
  # web-component-tests:
