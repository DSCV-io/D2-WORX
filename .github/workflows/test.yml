name: PR

# Single-lane CI.
#
# Active jobs ramp up as services come online.
# Each job below is commented out until its target service or workspace
# exists; uncomment once the cited path is populated.
# Total wall time target: <5 minutes (all active jobs run in parallel).
#
# Required gates (non-skippable once active):
#   - integration-key-rotation (KeyCustodian rotation flow)

on:
  pull_request:
    branches: [main, nova]
  push:
    branches: [main, nova]

jobs:
  # ==========================================================================
  # Active now (no service dependencies)
  # ==========================================================================

