name: PR

# PR CI — parallel lanes.
#
# Active jobs ramp up as services come online.
# Each job below is commented out until its target service or workspace
# exists; uncomment once the cited path is populated.
# Total wall time target: <5 minutes (all active jobs run in parallel).
#
# All active jobs must pass before merge. Which checks actually block a merge
# is configured in branch protection (Settings -> Branches -> required status
# checks), NOT the job name — names carry no special meaning to GitHub.

on:
  pull_request:
    branches: [main, nova]
  push:
    branches: [main, nova]

jobs:
  # ==========================================================================
  # Active now (no service dependencies)
  # ==========================================================================

  # ---------------------------------------------------------------------------
  # Proto checks (buf lint + format) — active: buf.yaml now committed.
  # Enforces STANDARD lint rules and format consistency on hand-authored protos.
  # Scoped to `contracts/protos/` (the shared stable protos); the emitted
  # *.g.proto files in server/ are NOT reformatted here (§26.5 — fix the
  # emitter, never hand-edit generated output).
  # ---------------------------------------------------------------------------
  proto-checks:
    name: Proto checks (buf lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf lint (STANDARD rule set)
        run: buf lint contracts/protos
      - name: buf format (hand-authored protos only)
        run: buf format --diff --exit-code contracts/protos

  # ---------------------------------------------------------------------------
  # Proto breaking-change gate — always on, PR-blocking.
  # Runs `buf breaking` at FILE level over the shared `contracts/protos/` tree
  # against the `nova` baseline. Pre-stable packages (vNalpha/vNbeta) are exempt
  # via the `proto-arm` wrapper in `tools/contract-gate`. The shared `d2.common.v1`
  # protos are stable and always enforced.
  # Needs full git history (`fetch-depth: 0`) so `nova` resolves as a ref.
  # ---------------------------------------------------------------------------
  proto-breaking:
    name: Proto breaking-change gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch nova baseline
        run: git fetch origin nova:nova
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (contract-gate + its workspace deps)
        run: pnpm install --filter "contract-gate..." --filter "@d2/typespec-emitters..."
      - name: build contract-gate
        run: pnpm --filter contract-gate build
      - name: Proto breaking-change gate (buf breaking at FILE level vs nova)
        run: node tools/contract-gate/dist/cli.js --against nova --proto-only

  # ---------------------------------------------------------------------------
  # Contract breaking-change gate (spec / i18n / OpenAPI) — always on, PR-blocking.
  # Runs the JSON-diff gate over `contracts/**/*.spec.json`, `contracts/messages/*.json`,
  # and committed `*.openapi.g.json` docs against the `nova` baseline.
  # Needs full git history so `git show nova:<path>` resolves baseline file content.
  # ---------------------------------------------------------------------------
  contract-breaking:
    name: Contract breaking-change gate (spec / i18n / OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch nova baseline
        run: git fetch origin nova:nova
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (contract-gate + its workspace deps)
        run: pnpm install --filter "contract-gate..." --filter "@d2/typespec-emitters..."
      - name: build contract-gate
        run: pnpm --filter contract-gate build
      - name: Spec / i18n / OpenAPI breaking-change gate (JSON-diff vs nova)
        run: node tools/contract-gate/dist/cli.js --against nova --skip-proto

  # ---------------------------------------------------------------------------
  # Contract-gate unit tests — always on.
  # Runs the owned-code test suite for `tools/contract-gate` (footer parser,
  # spec-diff, i18n-diff, openapi-diff, proto-exemption, catalog-identity, and
  # the proto-arm integration test). §26.15/§26.16 owned-tooling validation.
  # ---------------------------------------------------------------------------
  contract-gate-unit:
    name: Contract gate unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (contract-gate + its workspace deps)
        run: pnpm install --filter "contract-gate..." --filter "@d2/typespec-emitters..." --filter "ts-codegen..."
      - name: build contract-gate dependencies
        run: pnpm --filter "@d2/typespec-emitters..." build
      - name: Contract gate unit + integration tests
        run: pnpm --filter contract-gate test

  # ---------------------------------------------------------------------------
  # Release-runner unit tests — always on.
  # Runs the owned-code test suite for `tools/release-runner` (bump engine,
  # manifest editor, changelog editor, semver, and runner integration tests).
  # §26.15/§26.16 owned-tooling validation — mirrors contract-gate-unit.
  # ---------------------------------------------------------------------------
  release-runner-unit:
    name: Release runner unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: pnpm install (release-runner + its workspace deps)
        run: pnpm install --filter "release-runner..." --filter "ts-codegen..."
      - name: build release-runner dependencies
        run: pnpm --filter "release-runner^..." build
      - name: Release runner unit tests
        run: pnpm --filter release-runner test

