#
# Root TypeSpec compiler configuration for contracts/typespec/.
#
# Invokes @d2/typespec-emitters for C# DTO + TS DTO emission.
# The csharp-namespace option sets the C# namespace root; individual ops
# are placed directly in this namespace. The Queries/Commands category
# derivation is deferred to a later step when @d2* category decorators land.

emit:
  - "@d2/typespec-emitters"

options:
  "@d2/typespec-emitters":
    # Live emit goes to dist/generated/ (relative to the emitter package).
    # The committed C# + proto fixtures in server/services/edge/tests/Unit/KeyCustodian/
    # are independently byte-pinned snapshots; they are NOT regenerated by tsp compile.
    # See "Regenerating the committed fixtures" in server/shared/typescript/typespec-emitters/README.md
    # for how to refresh and recommit them when the emitter changes.
    emitter-output-dir: "{project-root}/../../server/shared/typescript/typespec-emitters/dist/generated"

    # C# namespace for generated DTO sealed records (Input/Output).
    csharp-namespace: "D2.Generated.TypeSpec"

    # proto3 package declaration (e.g. "d2.keycustodian.v1").
    # Fed to the proto emitter; the domain segment varies per service.
    proto-package: "d2.keycustodian.v1"

    # C# namespace declared in the emitted proto's `option csharp_namespace`.
    # Must match the Grpc.Tools output namespace for generated message + service types.
    proto-csharp-namespace: "D2.Services.Protos.KeyCustodian.V1"

    # C# namespace for the generated gRPC service-impl class + transport mapper.
    # Distinct from proto-csharp-namespace so proto types and service impl do not collide.
    grpc-service-namespace: "D2.Edge.Tests.TypeSpecGrpc.Generated"

imports:
  - "./key-custodian/key-custodian.tsp"
  - "./fixtures/sign-shaped.tsp"
