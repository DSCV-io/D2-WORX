#
# Root TypeSpec compiler configuration for contracts/typespec/.
#
# Invokes @d2/typespec-emitters for C# DTO + TS DTO emission.
# The csharp-namespace option sets the C# namespace root; individual ops
# are placed directly in this namespace. The Queries/Commands category
# derivation is deferred to a later step when @d2* category decorators land.

emit:
  - "@d2/typespec-emitters"

options:
  "@d2/typespec-emitters":
    # Live emit goes to dist/generated/ (relative to the emitter package).
    # The committed C# fixtures in server/services/edge/tests/Unit/KeyCustodian/TypeSpecDto/Generated/
    # are an independently byte-pinned snapshot; they are NOT regenerated by tsp compile.
    # See "Regenerating the committed fixtures" in server/shared/typescript/typespec-emitters/README.md
    # for how to refresh and recommit them when the emitter changes.
    emitter-output-dir: "{project-root}/../../server/shared/typescript/typespec-emitters/dist/generated"
    csharp-namespace: "D2.Generated.TypeSpec"

imports:
  - "./key-custodian/key-custodian.tsp"
  - "./fixtures/sign-shaped.tsp"
