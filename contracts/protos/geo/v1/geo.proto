syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "common/v1/d2_result.proto";
import "common/v1/health.proto";

package d2.geo.v1;

option csharp_namespace = "D2.Services.Protos.Geo.V1";

// ******************************
// **** GeoService gRPC API *****
// ******************************

service GeoService {
  // Health check — pings all dependencies (DB, cache, messaging).
  rpc CheckHealth(d2.common.v1.CheckHealthRequest)
      returns (d2.common.v1.CheckHealthResponse);

  rpc GetReferenceData(GetReferenceDataRequest)
      returns (GetReferenceDataResponse);

  rpc RequestReferenceDataUpdate(RequestReferenceDataUpdateRequest)
      returns (RequestReferenceDataUpdateResponse);

  rpc FindWhoIs(FindWhoIsRequest)
      returns (FindWhoIsResponse);

  // Internal only — not exposed via Geo client libraries.
  // External consumers use GetContactsByExtKeys / DeleteContactsByExtKeys / UpdateContactsByExtKeys.
  rpc GetContacts(GetContactsRequest)
      returns (GetContactsResponse);

  // Internal only — not exposed via Geo client libraries.
  // External consumers use DeleteContactsByExtKeys.
  rpc DeleteContacts(DeleteContactsRequest)
      returns (DeleteContactsResponse);

  rpc GetContactsByExtKeys(GetContactsByExtKeysRequest)
      returns (GetContactsByExtKeysResponse);

  rpc CreateContacts(CreateContactsRequest)
      returns (CreateContactsResponse);

  rpc DeleteContactsByExtKeys(DeleteContactsByExtKeysRequest)
      returns (DeleteContactsByExtKeysResponse);

  // Replaces contacts at the given ext keys. Geo internally deletes old, creates new.
  rpc UpdateContactsByExtKeys(UpdateContactsByExtKeysRequest)
      returns (UpdateContactsByExtKeysResponse);
}

// **************************************
// ***** RequestReferenceDataUpdate *****
// **************************************

message RequestReferenceDataUpdateRequest {}

message RequestReferenceDataUpdateResponse {
    d2.common.v1.D2ResultProto result = 1;
    RequestReferenceDataUpdateData data = 2;
}

message RequestReferenceDataUpdateData {
    string version = 1;
}

// ****************************
// ***** GetReferenceData *****
// ****************************

message GetReferenceDataRequest {}

message GetReferenceDataResponse {
    d2.common.v1.D2ResultProto result = 1;
    GeoRefData data = 2;
}

message GeoRefData {
  string version = 1; // Semantic version of the reference data.
  google.protobuf.Timestamp updated_at = 2; // Timestamp of the last update.
  map<string, CountryDTO> countries = 3; // Key is iso_3166_1_alpha_2_code.
  map<string, SubdivisionDTO> subdivisions = 4; // Key is iso_3166_2_code.
  map<string, CurrencyDTO> currencies = 5; // Key is iso_4217_alpha_code.
  map<string, LanguageDTO> languages = 6; // Key is iso_639_1_code.
  map<string, LocaleDTO> locales = 7; // Key is ietf_bcp_47_tag.
  map<string, GeopoliticalEntityDTO> geopolitical_entities = 8; // Key is short_code.
  map<string, TimezoneDTO> timezones = 9; // Key is iana_identifier.
}

// *********************
// ***** FindWhoIs *****
// *********************

message FindWhoIsRequest {
  repeated FindWhoIsKeys requests = 1;
}

message FindWhoIsKeys {
  string ip_address = 1;
  reserved 2;  // Removed: fingerprint (no longer part of WhoIs identity).
  reserved "fingerprint";
}

message FindWhoIsResponse {
  d2.common.v1.D2ResultProto result = 1;
  repeated FindWhoIsData data = 2;
}

message FindWhoIsData {
  FindWhoIsKeys key = 1;
  WhoIsDTO whois = 2;
}

// ***********************
// ***** GetContacts *****
// ***********************

message GetContactsRequest {
  repeated string ids = 1;
}

message GetContactsResponse {
  d2.common.v1.D2ResultProto result = 1;
  map<string, ContactDTO> data = 2; // Key is id.
}

// ********************************
// ***** GetContactsByExtKeys *****
// ********************************

message GetContactsByExtKeysRequest {
  repeated GetContactsExtKeys keys = 1;
}

message GetContactsExtKeys {
  string context_key = 1;
  string related_entity_id = 2;
}

message GetContactsByExtKeysResponse {
  d2.common.v1.D2ResultProto result = 1;
  repeated GetContactsByExtKeysData data = 2;
}

message GetContactsByExtKeysData {
    GetContactsExtKeys key = 1;
    repeated ContactDTO contacts = 2;
}

// **************************
// ***** CreateContacts *****
// **************************

message CreateContactsRequest {
  repeated ContactToCreateDTO contacts_to_create = 1;
}

message CreateContactsResponse {
  d2.common.v1.D2ResultProto result = 1;
  repeated ContactDTO data = 2;
}

// ***************************
// ***** DeleteContacts ******
// ***************************

message DeleteContactsRequest {
  repeated string ids = 1;
}

message DeleteContactsResponse {
  d2.common.v1.D2ResultProto result = 1;
  int32 deleted = 2;
}

// ************************************
// ***** DeleteContactsByExtKeys ******
// ************************************

message DeleteContactsByExtKeysRequest {
  repeated GetContactsExtKeys keys = 1;
}

message DeleteContactsByExtKeysResponse {
  d2.common.v1.D2ResultProto result = 1;
  int32 deleted = 2;
}

// ************************************
// ***** UpdateContactsByExtKeys ******
// ************************************

// Replaces contacts at the given ext keys. Geo internally deletes old, creates new.
// Uses the same ContactToCreateDTO shape (which already contains context_key + related_entity_id).
message UpdateContactsByExtKeysRequest {
  repeated ContactToCreateDTO contacts = 1;
}

message UpdateContactsByExtKeysResponse {
  d2.common.v1.D2ResultProto result = 1;
  repeated ContactReplacement replacements = 2;
}

// Rich key identifying which old contact was replaced, with full ext-key context.
message ContactReplacementKey {
  string context_key = 1;
  string related_entity_id = 2;
  string old_contact_id = 3;
}

// One entry per old contact that was replaced.
message ContactReplacement {
  ContactReplacementKey key = 1;
  ContactDTO new_contact = 2;
}

// ***********************
// ***** Shared DTOs *****
// ***********************

message ContactToCreateDTO {
  google.protobuf.Timestamp created_at = 1;
  string context_key = 2;
  string related_entity_id = 3;
  optional ContactMethodsDTO contact_methods = 4;
  optional PersonalDTO personal_details = 5;
  optional ProfessionalDTO professional_details = 6;
  optional LocationDTO location = 7;  // Full location data or just hash_id to reference existing.
  optional string ietf_bcp47_tag = 8;  // IETF BCP 47 locale tag (e.g. "en-US", "fr-CA"). Synced from User.locale.
  optional string iana_identifier = 9;  // IANA timezone identifier (e.g. "America/New_York"). Synced from User.timezone.
}

// *********************
// ***** Full DTOs *****
// *********************

message CountryDTO {
  // Primary key.
  string iso_3166_1_alpha_2_code = 1;

  // Unique keys.
  string iso_3166_1_alpha_3_code = 2;
  string iso_3166_1_numeric_code = 3;

  // Properties.
  string display_name = 4;
  string official_name = 5;
  string phone_number_prefix = 6;
  string phone_number_format = 7;

  // Foreign keys.
  string sovereign_iso_3166_1_alpha_2_code = 8;
  string primary_currency_iso_4217_alpha_code = 9;
  string primary_locale_ietf_bcp_47_tag = 10;

  // Navigation properties as lists of identifiers.
  repeated string territory_iso_3166_1_alpha_2_codes = 11; // One-to-many.
  repeated string subdivision_iso_3166_2_codes = 12; // One-to-many.
  repeated string currency_iso_4217_alpha_codes = 13; // Many-to-many.
  repeated string locale_ietf_bcp_47_tags = 14; // One-to-many.
  repeated string geopolitical_entity_short_codes = 15; // Many-to-many.
}

message SubdivisionDTO {
  // Primary key.
  string iso_3166_2_code = 1;

  // Properties.
  string short_code = 2;
  string display_name = 3;
  string official_name = 4;

  // Foreign keys.
  string country_iso_3166_1_alpha_2_code = 5;
}

message CurrencyDTO {
  // Primary key.
  string iso_4217_alpha_code = 1;

  // Unique keys.
  string iso_4217_numeric_code = 2;

  // Properties.
  string display_name = 3;
  string official_name = 4;
  int32 decimal_places = 5;
  string symbol = 6;

  // Navigation properties as lists of identifiers.
  repeated string country_iso_3166_1_alpha_2_codes = 7; // Many-to-many.
}

message LanguageDTO {
  // Primary key.
  string iso_639_1_code = 1;

  // Properties.
  string name = 2;
  string endonym = 3;
}

message LocaleDTO {
  // Primary key.
  string ietf_bcp_47_tag = 1;

  // Properties.
  string name = 2;
  string endonym = 3;

  // Foreign keys.
  string language_iso_639_1_code = 4;
  string country_iso_3166_1_alpha_2_code = 5;
}

message TimezoneDTO {
  // Primary key.
  string iana_identifier = 1;

  // Properties.
  string display_name = 2;
  string utc_offset_std = 3;
  optional string utc_offset_dst = 4;
  string abbreviation_std = 5;
  optional string abbreviation_dst = 6;

  // Foreign keys.
  string country_iso_3166_1_alpha_2_code = 7;
}

message GeopoliticalEntityDTO {
  // Primary key.
  string short_code = 1;

  // Properties.
  string name = 2;
  string type = 3;

  // Navigation properties as lists of identifiers.
  repeated string country_iso_3166_1_alpha_2_codes = 4; // Many-to-many.
}

message CoordinatesDTO {
  double latitude = 1;
  double longitude = 2;
}

message StreetAddressDTO {
  string line_1 = 1;
  optional string line_2 = 2;
  optional string line_3 = 3;
}

message EmailAddressDTO {
  string value = 1;
  repeated string labels = 2;
}

message PhoneNumberDTO {
  string value = 1;
  repeated string labels = 2;
}

message PersonalDTO {
  optional string title = 1;
  string first_name = 2;
  optional string preferred_name = 3;
  optional string middle_name = 4;
  optional string last_name = 5;
  optional string generational_suffix = 6;
  repeated string professional_credentials = 7;
  optional string date_of_birth = 8;
  optional string biological_sex = 9;
}

message ProfessionalDTO {
  string company_name = 1;
  optional string job_title = 2;
  optional string department = 3;
  optional string company_website = 4;
}

message ContactMethodsDTO {
  repeated EmailAddressDTO emails = 1;
  repeated PhoneNumberDTO phone_numbers = 2;
}

message LocationDTO {
  string hash_id = 1;
  optional CoordinatesDTO coordinates = 2;
  optional StreetAddressDTO address = 3;
  optional string city = 4;
  optional string postal_code = 5;
  optional string subdivision_iso_3166_2_code = 6;
  optional string country_iso_3166_1_alpha_2_code = 7;
}

message WhoIsDTO {
  string hash_id = 1;

  // Content-addressable properties.
  string ip_address = 2;
  int32 year = 3;
  int32 month = 4;
  reserved 5;  // Removed: fingerprint (no longer part of WhoIs identity).

  // ASN properties.
  optional int32 asn = 6;
  optional string as_name = 7;
  optional string as_domain = 8;
  optional string as_type = 9;

  // Carrier properties.
  optional string carrier_name = 10;
  optional string mcc = 11;
  optional string mnc = 12;

  // Change dates (ISO 8601 date strings).
  optional string as_changed = 13;
  optional string geo_changed = 14;

  // Network flags.
  optional bool is_anonymous = 15;
  optional bool is_anycast = 16;
  optional bool is_hosting = 17;
  optional bool is_mobile = 18;
  optional bool is_satellite = 19;
  optional bool is_proxy = 20;
  optional bool is_relay = 21;
  optional bool is_tor = 22;
  optional bool is_vpn = 23;
  optional string privacy_name = 24;

  // Location data.
  optional LocationDTO location = 25;  // Full location data (null if no location).
}

message ContactDTO {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  string context_key = 3;
  string related_entity_id = 4;
  optional ContactMethodsDTO contact_methods = 5;
  optional PersonalDTO personal_details = 6;
  optional ProfessionalDTO professional_details = 7;
  optional LocationDTO location = 8;  // Full location data (null if no location).
  string ietf_bcp47_tag = 9;  // IETF BCP 47 locale tag (e.g. "en-US", "fr-CA"). Synced from User.locale.
  string iana_identifier = 10;  // IANA timezone identifier (e.g. "America/New_York"). Synced from User.timezone.
}
