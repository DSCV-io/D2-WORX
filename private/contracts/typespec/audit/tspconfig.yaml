#
# Per-module TypeSpec compile unit for Audit (standalone process).
# {project-root} = contracts/typespec/audit/ — emitter-output-dir uses one extra
# ../ vs the historical root config so output still lands in the shared
# typespec-emitters/dist/generated directory.
#
# Regen: N× (tsp compile this package + COPY_MANIFEST subset for Audit) —
# never batch-compile then one COPY over the shared emit dir.

emit:
  - "@dcsv-io/d2-typespec-emitters"

options:
  "@dcsv-io/d2-typespec-emitters":
    # Nested project-root needs ../../../ to reach the same shared emit dir as
    # the historical root contracts/typespec/ config (../../ from root).
    emitter-output-dir: "{project-root}/../../../public/packages/typescript/typespec-emitters/dist/generated"

    # Client package namespace for Audit transport DTOs + gRPC client surface.
    csharp-clients-namespace: "DcsvIo.D2.Private.Audit.Client"

    # App handler-namespace base: per-op CQRS path = <base>.<Category>.<PascalOp>.
    csharp-app-namespace-base: "DcsvIo.D2.Private.Audit.App.Application.Handlers"

    # proto3 package — pre-stable channel for Audit.
    proto-package: "d2.audit.v2alpha"

    # C# namespace for Grpc.Tools-generated message + service types.
    proto-csharp-namespace: "D2.Services.Protos.Audit.V2Alpha"

    # Thin gRPC service-impl + transport mappers live on Audit.Api.
    grpc-service-namespace: "DcsvIo.D2.Private.Audit.Api.Grpc"

    # Audit is a standalone process: public HTTP is Edge→Audit gRPC bridge only.
    process-kind-by-module:
      Audit: standalone

    # Edge HTTP→gRPC bridge registrations for standalone Audit ops.
    csharp-bridge-namespace:
      Audit: "DcsvIo.D2.Private.Edge.Api.Bridges.Audit"

    # No TS client package for Audit multiproc stub — omit ts-client-output-dirs.

imports:
  - "./audit.tsp"
