#
# Per-module TypeSpec compile unit for KeyCustodian (edge-module).
# {project-root} = contracts/typespec/key-custodian/ — emitter-output-dir uses
# one extra ../ so output still lands in the shared dist/generated directory.
#
# Fixtures that historically co-compiled with KC (COPY_MANIFEST TS rows +
# process-kind entries) remain imported here so scatter stays byte-stable.
# Audit is NEVER co-imported (wrong package/ns stamp).

emit:
  - "@d2/typespec-emitters"

options:
  "@d2/typespec-emitters":
    # Nested project-root needs ../../../ to reach the same shared emit dir as
    # the historical root contracts/typespec/ config (../../ from root).
    emitter-output-dir: "{project-root}/../../../public/packages/typescript/typespec-emitters/dist/generated"

    # C# namespace for fixture ops (signFixture) — retained for backward compatibility.
    csharp-namespace: "D2.Edge.Tests.TypeSpecDto.Generated"

    # Client project namespace: exposed-op DTOs and the module façade interface.
    csharp-clients-namespace: "D2.Edge.KeyCustodian.Client"

    # App handler-namespace base: per-op CQRS path = <base>.<Category>.<PascalOp>.
    csharp-app-namespace-base: "D2.Edge.KeyCustodian.App.Application.Handlers"

    # proto3 package declaration following the stability-channel scheme.
    proto-package: "d2.keycustodian.v2alpha"

    # C# namespace declared in the emitted proto's `option csharp_namespace`.
    proto-csharp-namespace: "D2.Services.Protos.KeyCustodian.V2Alpha"

    # C# namespace for the generated gRPC service-impl class + transport mapper.
    # Production Edge.Api home (thin services + co-located transport mappers).
    grpc-service-namespace: "D2.Edge.Api.Grpc.KeyCustodian"

    # Process kind per @d2ServedBy module — closed set: edge-module | standalone.
    process-kind-by-module:
      KeyCustodian: edge-module
      # Co-compiled fixture ops (sign-shaped) share this package's option set;
      # they still need a process-kind entry (real-module + @route fail-loud).
      SignFixture: edge-module

    # C# namespace for generated REST Map* route registrations, keyed by @d2ServedBy.
    csharp-routes-namespace:
      KeyCustodian: "D2.Edge.Api.Routes.KeyCustodian"
      # Fixture routes stay under the fixture transport ns (not production Edge.Api).
      SignFixture: "D2.Edge.Tests.TypeSpecRoute.Generated"

    # TS-client production-emission target — per @d2ServedBy module → package src root.
    # Paths are repo-root-relative; the emitter walks ancestors for the monorepo
    # root (D2.slnx + contracts/typespec), not a fixed tspconfig folder depth.
    ts-client-output-dirs:
      KeyCustodian: "private/services/edge/key-custodian/client-ts/src"

imports:
  - "./key-custodian.tsp"
  - "../fixtures/sign-shaped.tsp"
  - "../fixtures/temporal-shaped.tsp"
  - "../fixtures/enum-shaped.tsp"
  - "../fixtures/resilience-predicate-shaped.tsp"
