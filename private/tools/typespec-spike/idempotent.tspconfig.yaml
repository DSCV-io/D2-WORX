# Spike C — idempotency gate. Runs the custom @d2/spike-emitter against
# idempotent.tsp (header key source) or idempotent-derived.tsp (derived key
# source). Output root is `generated/` (matching the SC1 / Spike A layout); the
# emitter resolves up from its per-emitter output dir to the spike root and
# writes the .NET artifacts into the Spike.Idempotency.* project folders.
output-dir: "{project-root}/generated"
emit:
  - "@d2/spike-emitter"
