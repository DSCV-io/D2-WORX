# Project-owned Codex harness. User/session approval and sandbox policy remain
# operator-owned; this file pins only repository behavior and integrations.
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
project_doc_max_bytes = 65536

[agents]
# Aspiration: K+1 with K<=7 (full K=7 Auditors + orchestrator seat).
# Host may cap concurrent agent slots far lower (observed ~4) — see
# docs/dev/harness-runtimes.md Codex known host limits. Not proven K=8.
max_threads = 8
max_depth = 1

[mcp_servers.codebase-memory-mcp]
command = "codebase-memory-mcp"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 60
# MCP tools that write still require approval; does not replace d2-policy-guard
# or §13 user permission gates. Documented in harness-runtimes.md Codex section.
default_tools_approval_mode = "writes"

[[hooks.PreToolUse]]
# Bash + patch/edit/write + Read-class names used by common hosts.
# Residual: MCP filesystem tools outside this matcher are behavioral-only
# (documented in harness-runtimes.md). Prefer expand when host emits new names.
matcher = "^(Bash|apply_patch|Edit|Write|Read|read_file|Grep|grep_files|Glob|glob_files)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/.codex/hooks/d2-policy-guard.mjs"'
command_windows = "powershell.exe -NoProfile -Command \"node ((git rev-parse --show-toplevel) + '/.codex/hooks/d2-policy-guard.mjs')\""
timeout = 5
statusMessage = "Checking D2-WORX repository policy"

[[hooks.SessionStart]]
matcher = "compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/.codex/hooks/post-compact-context.mjs"'
command_windows = "powershell.exe -NoProfile -Command \"node ((git rev-parse --show-toplevel) + '/.codex/hooks/post-compact-context.mjs')\""
timeout = 5
statusMessage = "Restoring D2-WORX context"
