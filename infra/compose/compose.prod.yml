# D2-WORX Docker Compose — Production / Staging Stack
# Extends compose.yml with production-specific overrides.
#
# Usage (Compose):
#   docker compose -f infra/compose/compose.yml -f infra/compose/compose.prod.yml \
#     --env-file .env.local --env-file .env.secrets up -d
#
# Usage (Swarm — eventual production deployment per V2.md §5.9):
#   docker stack deploy -c infra/compose/compose.yml -c infra/compose/compose.prod.yml d2-worx
#
# Key differences from dev:
#   - Pre-built images from ghcr.io (no build: context, no source mounts)
#   - deploy: blocks with restart_policy + resource limits (Swarm-native)
#   - Dev-only services disabled via profiles (pgAdmin, RedisInsight, Portainer)
#
# Application service overrides (d2-edge, d2-files, etc.) are added per
# V2.md §4 phases as services come online.

services:
  # ==========================================================================
  # Infrastructure — deploy blocks for Swarm + tighter resource limits
  # ==========================================================================

  d2-postgres:
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  d2-redis:
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  d2-rabbitmq:
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  d2-minio:
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  d2-dkron:
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  d2-clamav:
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ==========================================================================
  # Observability — deploy blocks for Swarm
  # ==========================================================================

  d2-loki:
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  d2-alloy:
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  d2-grafana:
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ==========================================================================
  # Dev-only services — disabled in production via profiles
  # ==========================================================================

  d2-pgadmin:
    profiles: [dev-tools]

  d2-redisinsight:
    profiles: [dev-tools]

  d2-portainer:
    profiles: [dev-tools]
